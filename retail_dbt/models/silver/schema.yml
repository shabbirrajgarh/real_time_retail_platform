    description: Cleaned transaction records

    columns:
      - name: transaction_id
        tests:
          - not_null

      - name: customer_id
        tests:
          - not_null

      - name: product
        tests:
          - not_null

      - name: quantity
        tests:
          - not_null

      - name: price
        tests:
          - not_null